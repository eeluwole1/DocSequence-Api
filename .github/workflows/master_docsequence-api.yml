# CD for the DocSequence API: deploys to Azure App Service only after the CI workflow
# (build + all 42 tests against SQL Server) has passed on master. Generated by the Azure Portal,
# then changed to (1) wait for CI via workflow_run and (2) publish only the API project.
# Docs: https://github.com/Azure/webapps-deploy

name: Deploy to Azure Web App - docsequence-api

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    # Manual runs deploy the current commit; automatic runs only if CI succeeded
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}   # exactly the commit CI tested

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: dotnet publish (API project only)
        run: dotnet publish DocSequence.Api/DocSequence.Api.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_3736DA6595B144F9A41E404E7DA03C95 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C0F88888C46848D494023C6661EB2DE0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_79007F30F24E40CFBE30445C09F71E2A }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'docsequence-api'
          slot-name: 'Production'
          package: .
